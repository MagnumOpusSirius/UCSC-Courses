<!DOCTYPE html>
<html>
<head>
  <title>My Dating Website</title>
  <style>
    /* CSS styles go here */
    body {
        background-image: url('flower.jpg');
        background-repeat: no-repeat;
        background-size: cover;
      }
      section {
        padding: 10px;
        margin-bottom: 10px;
        color: #000; /* Replace with your desired font color */
        border: 2px solid #ffcc00; /* Light yellow */
        background-color: #ffffcc; /* Light yellow */
      }
      

      section h2 {
        margin-top: 0;
      }
      h1 {
        color: #fff; /* Replace with your desired font color */
      }

      label {
        display: inline-block;
        width: 150px;
        transition: transform 0.3s ease-in-out;
      }
  
      input[type="email"],
      input[type="tel"],
      textarea {
        width: 250px;
        box-sizing: border-box;
        transition: transform 0.3s ease-in-out;
      }
      .height-bar {
        display: flex;
        align-items: center;
      }
  
      .height-label-left,
      .height-label-right {
        display: inline-block;
        padding: 5px;
        font-weight: bold;
        color: #fff;
      }
  
      .height-label-left {
        background-color: #ff0000; /* Light red */
        margin-right: 5px;
      }
  
      .height-label-right {
        background-color: #cc99ff; /* Light purple */
        margin-left: 5px;
      }
    label:hover,
    input:hover,
    textarea:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <header>
    <h1>Please Enter Your Details For Our Dating Website!</h1>
  </header>
  
  <section>
    <h2>Your Face</h2>
    <label for="image-upload">Upload Image:</label>
    <input type="file" id="image-upload" accept="image/*">
    <p>Image Preview:</p>
    <div id="image-preview"></div>
  </section>
  
  <section>
    <h2>Your General Details</h2>
    <label for="full-name">Full Name:</label>
    <input type="text" id="full-name" placeholder="Enter your full name" title="Your full name"><br>
    
    <label for="gender">Gender:</label>
    <select id="gender">
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option>
    </select><br>
    
    <label for="age">Age:</label>
    <input type="number" id="age" min="18" max="99"><br>
    
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob"><br>
    
    <label for="favorite-color">Favorite Color:</label>
    <input type="color" id="favorite-color"><br>
    
    <label for="country">Country:</label>
    <input list="countries" id="country">
    <datalist id="countries">
      <option value="USA">
      <option value="Canada">
      <option value="UK">
      <option value="Australia">
    </datalist><br>
  </section>
  
  <section id="your-indicators">
    <h2>Your Indicators</h2>
    <label for="height">Height:</label>
    <div class="height-bar">
      <span class="height-label-left">Short</span>
      <input type="range" id="height" min="100" max="200">
      <span class="height-label-right">Tall</span>
    </div>
  
    <label for="salary">Salary:</label>
    <div class="height-bar">
        <span class="height-label-left">Poor</span>
        <input type="range" id="salary" min="100" max="200">
        <span class="height-label-right">Rich</span>
      </div>
      
    
  </section>
  
  <section>
    <h2>Your Contact Information</h2>
    <label for="email">Email:</label>
    <input type="email" id="email"><br>
  
    <label for="phone">Phone:</label>
    <input type="tel" id="phone"><br>
  
    <label for="address">Address:</label>
    <textarea id="address"></textarea><br>
  
    <label for="contact-method">Preferred Contact Method:</label>
    <input type="radio" id="contact-email" name="contact-method" value="email">
    <label for="contact-email">Email</label>
    <input type="radio" id="contact-phone" name="contact-method" value="phone">
    <label for="contact-phone">Phone</label>
    <input type="radio" id="contact-chat" name="contact-method" value="chat">
    <label for="contact-chat">In-app Chat</label><br>
  
    <input type="submit" value="Submit">
  </section>
  
  <footer>
    <p>© 2023 My Dating Website. All rights reserved.</p>
  </footer>

  <script>
    // JavaScript code for image preview
    const imageUpload = document.getElementById('image-upload');
    const imagePreview = document.getElementById('image-preview');
    
    imageUpload.addEventListener('change', function(event) {
      const file = event.target.files[0];
      const reader = new FileReader();
      
      reader.onload = function(e) {
        const image = document.createElement('img');
        image.src = e.target.result;
        imagePreview.innerHTML = '';
        imagePreview.appendChild(image);
      }
      
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
